<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Will You Go On A Date With Me?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <main class="card">
    <div class="icon-row">📅🐾</div>
    <h1>So... when are you free?</h1>

    <div class="field">
      <label for="dayInput">Pick a Day 📅</label>
      <input type="date" id="dayInput" />
    </div>

    <div class="field">
      <label for="timeInput">What Time? 🕐</label>
      <select id="timeInput">
        <option value="">Uhrzeit wählen...</option>
        <option value="00:00">00:00</option>
        <option value="01:00">01:00</option>
        <option value="02:00">02:00</option>
        <option value="03:00">03:00</option>
        <option value="04:00">04:00</option>
        <option value="05:00">05:00</option>
        <option value="06:00">06:00</option>
        <option value="07:00">07:00</option>
        <option value="08:00">08:00</option>
        <option value="09:00">09:00</option>
        <option value="10:00">10:00</option>
        <option value="11:00">11:00</option>
        <option value="12:00">12:00</option>
        <option value="13:00">13:00</option>
        <option value="14:00">14:00</option>
        <option value="16:00">16:00</option>
        <option value="18:00">18:00</option>
        <option value="19:00">19:00</option>
        <option value="20:00">20:00</option>
        <option value="21:00">21:00</option>
        <option value="22:00">22:00</option>
        <option value="23:00">23:00</option>
        <option value="24:00">20:00</option>
      </select>
    </div>

    <button id="setDateBtn" class="btn btn-yes btn-block" type="button" disabled>set the date! ♥</button>
  </main>

  <script src="/script.js"></script>
  <script>
    spawnParticles("particles", "♥", { interval: 700, minSize: 12, maxSize: 18, opacity: 0.3 });

    const dayInput = document.getElementById("dayInput");
    const timeInput = document.getElementById("timeInput");
    const setDateBtn = document.getElementById("setDateBtn");

    dayInput.value = loadDateChoice("day");
    timeInput.value = loadDateChoice("time");

    function checkReady() {
      setDateBtn.disabled = !(dayInput.value && timeInput.value);
    }
    checkReady();

    dayInput.addEventListener("input", checkReady);
    timeInput.addEventListener("change", checkReady);

    setDateBtn.addEventListener("click", () => {
      if (setDateBtn.disabled) return;
      saveDateChoice("day", dayInput.value);
      saveDateChoice("time", timeInput.value);
      notifyDateConfirmed(loadDateChoice("food"), dayInput.value, timeInput.value);
      window.location.href = "/yay";
    });
  </script>
</body>
</html>
